title: NS-RSI-Anything
description: Neuro-symbolic recursive self-improvement across general domains, from games to embodied robotics and computer use.
baseurl: /ns-rsi-anything-programme
url: https://smu-diga.github.io
repository: SMU-DIGA/ns-rsi-anything-programme
markdown: kramdown
permalink: /progress/:title/
defaults:
  - scope:
      path: ""
    values:
      layout: article
  - scope:
      type: posts
    values:
      layout: post
      numbered: true
exclude:
  - README.md
  - README.zh-CN.md
  - LICENSE
nav:
  - title: Overview
    url: /
  - title: Design
    url: /design/
  - title: Environments
    url: /environments/
  - title: Results
    url: /#results
  - title: Progress
    url: /progress/
  - title: Roadmap
    url: /roadmap/
  - title: BibTeX
    url: /#bibtex
