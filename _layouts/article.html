---
layout: default
---
<section class="page-hero">
  {% if page.kicker %}<p class="kicker">{{ page.kicker }}</p>{% endif %}
  <h1>{{ page.title }}</h1>
  {% if page.summary %}<p class="subtitle">{{ page.summary }}</p>{% endif %}
</section>
<div class="article-layout">
  <aside class="toc"><p class="toc-title">Contents</p><nav></nav></aside>
  <article class="article-body"{% if page.numbered %} data-numbered{% endif %}>
    {{ content }}
  </article>
</div>
