---
layout: default
---
<article class="post">
  <p class="meta"><a href="{{ '/progress/' | relative_url }}">← Progress</a> · <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time>{% if page.tags.size > 0 %} · {% for tag in page.tags %}<span class="tag">{{ tag }}</span>{% endfor %}{% endif %}</p>
  <h1>{{ page.title }}</h1>
  {{ content }}
</article>
